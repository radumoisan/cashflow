taxes:
  vat_rates: {"2025-01": 0.19, "2025-08": 0.21}
  profit_rate: 0.16
  dividend_rate: 0.16
  # User-approved assumption: standard VAT, with supplier VAT fully deductible.
  # Applies to historical net presentation and forecast seeding: 19% through
  # July 2025, 21% thereafter. Exact monthly accounting data supersedes estimates.
  # Source: user confirmation in chat and approval of the all-month net display.
  # The PDF alone does not establish this VAT split; original cash is retained.
  reported_cash_seed_basis: "gross-standard"
  checkpoints:
    "2026-01":
      source: "Explicit zero opening tax-state assumptions; replace with accounting state when supplied"
      kind: "assumption"
      vat_credit: 0.00
      profit_loss: 0.00
      payments: {}

