taxes:
  vat_rates: {"2025-01": 0.19, "2025-08": 0.21}
  profit_rate: 0.16
  dividend_rate: 0.16
  # User-approved assumption: standard VAT, with supplier VAT fully deductible.
  # Applies to historical net presentation and forecast seeding: 19% through
  # July 2025, 21% thereafter. Exact monthly accounting data supersedes estimates.
  # Source: user confirmation in chat and approval of the all-month net display.
  # The PDF alone does not establish this VAT split; original cash is retained.
  reported_cash_seed_basis: "gross-standard"
  checkpoints:
    "2026-01":
      source: "Explicit zero opening tax-state assumptions; replace with accounting state when supplied"
      kind: "assumption"
      vat_credit: 0.00
      profit_loss: 0.00
      payments: {}

# Positive payment magnitudes, keyed by payment month, with source and either
# total (Taxes only), or profit/dividend/other components; vat is separate.
tax_payments: {}

# Gross positive distributions keyed by event month, each with gross and source.
dividends: {}

# Regio is global and starts at zero. Monthly overrides never establish a run rate.
# Suppliers use net amounts; other categories use their regular row's cash basis.
expense_projects:
  regio:
    name: "Regio"
    source: "User instruction: global project tracking initialized at zero; no project allocation assumed in existing history"
    categories:
      - id: "suppliers"
        name: "Suppliers (net)"
        row_id: "suppliers"
        overrides: {}
      - id: "payroll"
        name: "Payroll"
        row_id: "net-salaries-and-taxes"
        overrides: {}
      - id: "fixed-assets"
        name: "Fixed Assets"
        row_id: "fixed-assets"
        overrides: {}
      - id: "advances"
        name: "Advances"
        row_id: "advances"
        overrides: {}
      - id: "miscellaneous"
        name: "Miscellaneous"
        row_id: "miscelaneous"
        overrides: {}

# Immutable source movements plus editable whole-movement ownership/VAT metadata.
